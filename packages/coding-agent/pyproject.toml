[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "e-coding-agent"
version = "0.1.0"
description = "Epsilon coding agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["e-ai", "e-agent"]

[tool.hatch.build.targets.wheel]
packages = ["src/e_coding_agent"]
