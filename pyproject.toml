[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "epsilon-workspace"
version = "0.1.0"
description = "Epsilon workspace for the pi monorepo port"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
e-ai = { workspace = true }
e-agent = { workspace = true }
e-coding-agent = { workspace = true }
e-tui = { workspace = true }

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3",
  "ruff>=0.11.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["packages"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["packages"]
